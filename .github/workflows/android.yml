# Compile l'APK Android de Hill Kicker.
# - À chaque push sur main : APK disponible dans l'onglet Actions (artefact).
# - À chaque tag vX.Y.Z : une release GitHub est créée avec l'APK à télécharger.
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Préparer le jeu (www/) et synchroniser Capacitor
        run: |
          npm ci
          node tools/build-app.mjs
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Nommer l'APK
        run: |
          V=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" src/game/version.js)
          cp android/app/build/outputs/apk/release/app-release.apk "HillKicker-v$V.apk"
          echo "APK=HillKicker-v$V.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Hill Kicker $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
