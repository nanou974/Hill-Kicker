# Compile l'APK Android de Hill Kicker.
# - À chaque push sur main : APK disponible dans l'onglet Actions (artefact).
# - Si la version de src/game/version.js n'a pas encore de release, une release vX.Y.Z
#   est créée avec l'APK à télécharger. Pour publier : il suffit d'augmenter VERSION.
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Le SDK Android est déjà installé sur les machines ubuntu-latest de GitHub

      - name: Préparer le jeu (www/) et synchroniser Capacitor
        run: |
          npm ci
          node tools/build-app.mjs
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Nommer l'APK
        run: |
          V=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" src/game/version.js)
          cp android/app/build/outputs/apk/release/app-release.apk "HillKicker-v$V.apk"
          echo "APK=HillKicker-v$V.apk" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publier la release (nouvelle version uniquement)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà : rien à publier."
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Hill Kicker $TAG" \
              --notes-file docs/release-notes.md
          fi
